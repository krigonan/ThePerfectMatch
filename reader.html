<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novel Reader</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:          #1a1410;
      --ink-soft:     #3a2f28;
      --ink-faint:    #6b5a50;
      --cream:        #f5efe8;
      --cream-deep:   #ede4d8;
      --cream-mid:    #e8ddd0;
      --accent:       #8b1a1a;
      --accent-soft:  #c0392b;
      --gold:         #b8860b;
      --gold-light:   #d4a843;
      --dark-bg:      #120c08;
      --dark-panel:   #1e1208;
    }

    html { font-size: 18px; scroll-behavior: smooth; }

    body {
      background: var(--dark-bg);
      color: var(--ink);
      font-family: 'EB Garamond', Georgia, serif;
      line-height: 1.85;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── GRAIN TEXTURE ─── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.5;
    }

    /* ════════════════════════════════════════════
       LANDING
    ════════════════════════════════════════════ */
    #landing {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      background: radial-gradient(ellipse at 50% 30%, #2a1508 0%, #0d0703 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .landing-panel {
      background: var(--cream);
      border: 1px solid var(--cream-mid);
      box-shadow: 0 0 0 1px rgba(184,134,11,0.3), 0 30px 80px rgba(0,0,0,0.7);
      border-radius: 3px;
      width: min(680px, 95vw);
      padding: 3rem 3.5rem 3rem;
      position: relative;
      animation: landingIn 0.8s ease both;
    }

    @keyframes landingIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .landing-panel::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--gold) 50%, var(--accent) 80%, transparent);
    }

    .landing-ornament {
      text-align: center; color: var(--gold);
      font-size: 1.1rem; letter-spacing: 0.6em;
      margin-bottom: 1.4rem; opacity: 0.8;
    }

    .landing-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      text-align: center;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 0.4rem;
    }

    .landing-sub {
      text-align: center;
      font-style: italic;
      color: var(--ink-faint);
      font-size: 0.96rem;
      margin-bottom: 1.8rem;
    }

    .landing-rule {
      display: flex; align-items: center; gap: 0.8rem;
      color: var(--gold); margin-bottom: 1.8rem;
    }
    .landing-rule::before, .landing-rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }
    .landing-rule span { font-size: 0.5rem; letter-spacing: 0.3em; }

    .landing-label {
      font-family: 'EB Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.6rem;
      display: block;
    }

    #json-input {
      width: 100%;
      height: 220px;
      background: #faf6f0;
      border: 1px solid var(--cream-deep);
      border-radius: 2px;
      padding: 1rem 1.1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--ink-soft);
      line-height: 1.55;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #json-input:focus { border-color: var(--gold); }
    #json-input::placeholder { color: var(--ink-faint); opacity: 0.6; }

    #parse-error {
      min-height: 1.4rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-style: italic;
      margin-top: 0.5rem;
      margin-bottom: 0.2rem;
    }

    #parse-btn {
      display: block;
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.9rem 2rem;
      background: var(--accent);
      color: var(--cream);
      border: none;
      border-radius: 2px;
      font-family: 'EB Garamond', serif;
      font-size: 1.05rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    #parse-btn:hover { background: #a02020; box-shadow: 0 4px 16px rgba(139,26,26,0.35); }
    #parse-btn:active { background: #700f0f; }
    #parse-btn .btn-ornament {
      display: inline-block;
      color: var(--gold-light);
      margin: 0 0.6em;
      font-size: 0.7em;
      vertical-align: middle;
    }


    /* ════════════════════════════════════════════
       READER LAYOUT
    ════════════════════════════════════════════ */
    #reader {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: var(--cream);
    }
    #reader.active { display: flex; }

    /* Progress bar */
    #progress-bar {
      height: 3px;
      background: var(--cream-deep);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ─── Reader Header ─── */
    #r-header {
      height: 58px;
      background: var(--cream);
      border-bottom: 1px solid var(--cream-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2rem;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      box-shadow: 0 1px 0 rgba(184,134,11,0.15);
    }

    #r-header::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      opacity: 0.5;
    }

    .header-btn {
      background: none;
      border: 1px solid var(--cream-deep);
      color: var(--ink-faint);
      font-family: 'EB Garamond', serif;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .header-btn:hover { border-color: var(--gold); color: var(--ink); background: rgba(184,134,11,0.06); }

    #r-book-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.82rem, 2.5vw, 1.05rem);
      font-style: italic;
      color: var(--ink-soft);
      text-align: center;
      flex: 1;
      padding: 0 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #r-progress-text {
      font-family: 'EB Garamond', serif;
      font-size: 0.78rem;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    /* ─── Reader Content ─── */
    #r-content {
      flex: 1;
      overflow-y: auto;
      background: var(--cream);
      scroll-behavior: smooth;
    }

    #r-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 3.5rem 2.5rem 5rem;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #r-page.fading { opacity: 0; }

    @media (max-width: 600px) {
      #r-page { padding: 2.5rem 1.3rem 4rem; }
    }

    /* ─── Reader Footer Nav ─── */
    #r-nav {
      height: 58px;
      background: var(--cream);
      border-top: 1px solid var(--cream-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2rem;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }
    #r-nav::before {
      content: '';
      position: absolute; top: -1px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      opacity: 0.5;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--cream-deep);
      color: var(--ink-faint);
      font-family: 'EB Garamond', serif;
      font-size: 0.88rem;
      letter-spacing: 0.1em;
      padding: 0.35rem 1.1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(139,26,26,0.04); }
    .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    #r-section-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.78rem, 2vw, 0.95rem);
      color: var(--ink-faint);
      text-align: center;
      flex: 1;
      padding: 0 0.5rem;
    }


    /* ════════════════════════════════════════════
       TOC OVERLAY
    ════════════════════════════════════════════ */
    #toc-overlay {
      position: fixed; inset: 0;
      background: rgba(18,12,8,0.65);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      backdrop-filter: blur(2px);
    }
    #toc-overlay.open { opacity: 1; visibility: visible; }

    #toc-panel {
      position: absolute; top: 0; left: 0;
      width: min(340px, 85vw);
      height: 100%;
      background: var(--cream);
      box-shadow: 4px 0 30px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    #toc-overlay.open #toc-panel { transform: translateX(0); }

    .toc-head {
      padding: 1.4rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--cream-deep);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .toc-head::after {
      content: '';
      position: absolute; top: 58px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-light), transparent);
      opacity: 0.4;
    }

    .toc-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--ink);
    }
    .toc-close-btn {
      background: none; border: none;
      color: var(--ink-faint); font-size: 1.1rem;
      cursor: pointer; padding: 0.2rem 0.4rem;
      transition: color 0.2s;
    }
    .toc-close-btn:hover { color: var(--accent); }

    #toc-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.8rem 0;
    }

    .toc-item {
      padding: 0.65rem 1.8rem 0.65rem 1.5rem;
      cursor: pointer;
      font-family: 'EB Garamond', serif;
      font-size: 0.95rem;
      color: var(--ink-soft);
      border-left: 3px solid transparent;
      transition: all 0.18s;
      line-height: 1.4;
    }
    .toc-item:hover { color: var(--ink); background: rgba(184,134,11,0.06); }
    .toc-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(139,26,26,0.04);
      font-style: italic;
    }
    .toc-item-sub {
      font-size: 0.78rem;
      color: var(--ink-faint);
      letter-spacing: 0.05em;
      display: block;
      margin-top: 0.1rem;
    }
    .toc-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--cream-deep), transparent);
      margin: 0.5rem 1.5rem;
    }


    /* ════════════════════════════════════════════
       SHARED COMPONENTS
    ════════════════════════════════════════════ */
    .ornament {
      display: block; text-align: center;
      color: var(--gold); font-size: 1.2rem;
      letter-spacing: 0.5em; margin: 1.2rem 0; opacity: 0.75;
    }

    .rule {
      display: flex; align-items: center; gap: 0.8rem;
      margin: 2rem 0; color: var(--gold);
    }
    .rule::before, .rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }
    .rule-diamond { font-size: 0.5rem; letter-spacing: 0.3em; color: var(--gold); }


    /* ════════════════════════════════════════════
       COVER SECTION
    ════════════════════════════════════════════ */
    .section-cover {
      text-align: center;
      padding: 2rem 0 3rem;
      animation: fadeUp 0.6s ease both;
    }

    .cover-genre {
      display: block;
      font-family: 'EB Garamond', serif;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 1.6rem;
    }

    .cover-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 700;
      line-height: 1.12;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 0.8rem;
    }
    .cover-title span { font-style: italic; color: var(--accent); }

    .cover-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.12rem;
      color: var(--ink-faint);
      margin-bottom: 0.6rem;
      line-height: 1.5;
    }

    .cover-author {
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
      margin-top: 0.4rem;
    }

    .cover-epigraph {
      margin: 2.2rem auto;
      max-width: 520px;
      padding: 1.6rem 2rem;
      border-top: 1px solid var(--cream-mid);
      border-bottom: 1px solid var(--cream-mid);
    }
    .epigraph-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--ink-soft);
      line-height: 1.65;
      text-align: center;
    }
    .epigraph-attr {
      font-size: 0.82rem;
      color: var(--ink-faint);
      text-align: right;
      margin-top: 0.8rem;
      letter-spacing: 0.06em;
    }

    .cover-meta {
      margin-top: 1.5rem;
      font-size: 0.88rem;
      color: var(--ink-faint);
      line-height: 1.9;
    }
    .cover-meta p { text-align: center; }

    .cover-themes {
      font-size: 0.86rem;
      color: var(--ink-faint);
      font-style: italic;
      margin-top: 1rem;
      text-align: center;
      line-height: 1.7;
    }

    .cover-setting-box {
      margin: 1.5rem auto 0;
      max-width: 480px;
      background: var(--cream-deep);
      padding: 1rem 1.5rem;
      border-radius: 2px;
      font-size: 0.88rem;
      color: var(--ink-faint);
      text-align: center;
      font-style: italic;
      line-height: 1.7;
    }


    /* ════════════════════════════════════════════
       CHARACTERS SECTION
    ════════════════════════════════════════════ */
    .section-characters { animation: fadeUp 0.6s ease both; }

    .section-heading {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .section-heading h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--ink);
      margin: 0.5rem 0;
    }

    .char-card {
      background: #faf6f0;
      border: 1px solid var(--cream-deep);
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      padding: 1.8rem 2rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .char-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .char-role {
      font-family: 'EB Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .char-meta {
      font-size: 0.85rem;
      color: var(--ink-faint);
      font-style: italic;
      margin-bottom: 0.9rem;
    }

    .char-desc {
      font-size: 0.97rem;
      color: var(--ink-soft);
      line-height: 1.8;
      margin-bottom: 1rem;
    }

    .char-traits {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.8rem;
    }
    .trait-tag {
      font-family: 'EB Garamond', serif;
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      background: var(--cream-deep);
      border: 1px solid var(--cream-mid);
      border-radius: 99px;
      color: var(--ink-faint);
      font-style: italic;
    }

    .char-status {
      margin-top: 0.8rem;
      font-size: 0.86rem;
      color: var(--gold);
      font-style: italic;
    }


    /* ════════════════════════════════════════════
       CHAPTER SECTION
    ════════════════════════════════════════════ */
    .section-chapter { animation: fadeUp 0.6s ease both; }

    .ch-header { text-align: center; margin-bottom: 2rem; }

    .ch-number {
      font-family: 'EB Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.6rem;
      display: block;
    }

    .ch-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 4.5vw, 2.2rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }

    .ch-pov {
      font-family: 'EB Garamond', serif;
      font-size: 0.76rem;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      font-style: italic;
      margin-top: 0.3rem;
    }

    .ch-epigraph {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--ink-soft);
      text-align: center;
      padding: 1.4rem 1.5rem;
      position: relative;
      margin: 1.5rem 0;
    }
    .ch-epigraph::before, .ch-epigraph::after {
      content: '\201C';
      font-size: 4rem; line-height: 0;
      position: absolute; opacity: 0.1;
      font-family: 'Playfair Display', serif;
      color: var(--accent);
    }
    .ch-epigraph::before { top: 2rem; left: 0; }
    .ch-epigraph::after  { content: '\201D'; bottom: 0.5rem; right: 0; }

    /* Body paragraphs */
    .ch-body p {
      margin-bottom: 1.4rem;
      font-size: 1.04rem;
      color: var(--ink-soft);
      text-align: justify;
      hyphens: auto;
    }

    /* Drop cap on first paragraph */
    .ch-body .p-first::first-letter {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 700;
      line-height: 0.72;
      float: left;
      margin-right: 0.1em;
      margin-top: 0.14em;
      color: var(--accent);
      text-shadow: 2px 2px 0 rgba(139,26,26,0.1);
    }

    /* Short / standalone dramatic lines */
    .ch-body .p-short {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--ink);
      font-size: 1.05rem;
      margin: 1.4rem 0;
    }

    /* Very short (single fragment) */
    .ch-body .p-fragment {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin: 1.6rem 0;
    }

    /* Dialogue-heavy paragraphs */
    .ch-body .p-dialogue {
      text-align: left;
    }

    /* Section break within a chapter */
    .ch-break {
      text-align: center;
      color: var(--gold);
      font-size: 0.85rem;
      letter-spacing: 0.8em;
      margin: 2.5rem 0;
      opacity: 0.55;
      user-select: none;
    }

    /* Pull quote */
    .pull-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      line-height: 1.5;
      color: var(--accent);
      text-align: center;
      margin: 2.5rem -0.5rem;
      padding: 1.5rem 2rem;
      border-top: 1.5px solid var(--accent-soft);
      border-bottom: 1.5px solid var(--accent-soft);
    }


    /* ════════════════════════════════════════════
       NOTABLE LINES
    ════════════════════════════════════════════ */
    .section-notable { animation: fadeUp 0.6s ease both; }

    .notable-list { margin-top: 1rem; }

    .notable-item {
      padding: 1.8rem 0;
      border-bottom: 1px solid var(--cream-deep);
      position: relative;
    }
    .notable-item:last-child { border-bottom: none; }
    .notable-item::before {
      content: '\201C';
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      line-height: 0;
      position: absolute;
      top: 2.2rem; left: -0.5rem;
      color: var(--gold);
      opacity: 0.2;
    }

    .notable-line {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.08rem;
      line-height: 1.65;
      color: var(--ink-soft);
      padding-left: 1rem;
    }

    .notable-source {
      font-family: 'EB Garamond', serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-align: right;
      margin-top: 0.7rem;
      text-transform: uppercase;
    }


    /* ════════════════════════════════════════════
       CLOSING NOTE
    ════════════════════════════════════════════ */
    .section-closing {
      text-align: center;
      animation: fadeUp 0.6s ease both;
      padding: 1rem 0 3rem;
    }

    .closing-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      color: var(--ink);
      margin: 0.6rem 0;
    }

    .closing-text {
      font-size: 1.02rem;
      color: var(--ink-soft);
      text-align: justify;
      hyphens: auto;
      line-height: 1.9;
      margin-bottom: 1.5rem;
    }

    .closing-final {
      margin: 2.5rem 0;
      padding: 2rem 2.5rem;
      border-top: 1.5px solid var(--accent-soft);
      border-bottom: 1.5px solid var(--accent-soft);
    }
    .closing-final p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--accent);
      line-height: 1.6;
      text-align: center;
    }

    .closing-fin {
      margin-top: 3rem;
    }
    .fin-word {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.8rem;
      color: var(--ink-faint);
      letter-spacing: 0.2em;
    }


    /* ════════════════════════════════════════════
       ANIMATIONS
    ════════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }


    /* ════════════════════════════════════════════
       SCROLLBAR
    ════════════════════════════════════════════ */
    #r-content::-webkit-scrollbar { width: 5px; }
    #r-content::-webkit-scrollbar-track { background: var(--cream-deep); }
    #r-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
    #toc-list::-webkit-scrollbar { width: 4px; }
    #toc-list::-webkit-scrollbar-thumb { background: var(--cream-mid); border-radius: 2px; }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .landing-panel { padding: 2rem 1.5rem; }
      #parse-btn { font-size: 0.9rem; }
      .header-btn, .nav-btn { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     LANDING SCREEN
══════════════════════════════════════════ -->
<div id="landing">
  <div class="landing-panel">
    <div class="landing-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    <h1 class="landing-title">Novel Reader</h1>
    <p class="landing-sub">A literary reading experience for your JSON novel</p>
    <div class="landing-rule"><span>◆ ◆ ◆</span></div>

    <label class="landing-label" for="json-input">Paste your novel JSON below</label>
    <textarea
      id="json-input"
      spellcheck="false"
      placeholder='{ "novel": { "title": "...", "chapters": [...] } }'
    ></textarea>

    <div id="parse-error"></div>

    <button id="parse-btn" onclick="parseNovel()">
      <span class="btn-ornament">✦</span>
      Open the Book
      <span class="btn-ornament">✦</span>
    </button>
  </div>
</div>


<!-- ══════════════════════════════════════════
     TABLE OF CONTENTS OVERLAY
══════════════════════════════════════════ -->
<div id="toc-overlay" onclick="closeTOC()">
  <aside id="toc-panel" onclick="event.stopPropagation()">
    <div class="toc-head">
      <span class="toc-heading">Contents</span>
      <button class="toc-close-btn" onclick="closeTOC()" aria-label="Close">✕</button>
    </div>
    <ul id="toc-list"></ul>
  </aside>
</div>


<!-- ══════════════════════════════════════════
     READER
══════════════════════════════════════════ -->
<div id="reader">

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <header id="r-header">
    <button class="header-btn" onclick="openTOC()">☰ &nbsp;Contents</button>
    <div id="r-book-title">Novel Reader</div>
    <div id="r-progress-text">1 / 1</div>
  </header>

  <main id="r-content">
    <div id="r-page"></div>
  </main>

  <nav id="r-nav">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Prev</button>
    <div id="r-section-name"></div>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next →</button>
  </nav>

</div>


<script>
  /* ══════════════════════════════════════════
     STATE
  ══════════════════════════════════════════ */
  let novel    = null;
  let sections = [];   // [{type, index?, label}]
  let currentIdx = 0;

  /* ══════════════════════════════════════════
     ENTRY: PARSE & RENDER
  ══════════════════════════════════════════ */
  function parseNovel() {
    const raw = document.getElementById('json-input').value.trim();
    const errEl = document.getElementById('parse-error');
    errEl.textContent = '';

    if (!raw) {
      errEl.textContent = 'Please paste your JSON data first.';
      return;
    }

    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      errEl.textContent = 'JSON error: ' + e.message;
      return;
    }

    // Accept { novel: {...} } or the object directly
    novel = data.novel || data;

    if (!novel || typeof novel !== 'object') {
      errEl.textContent = 'Unexpected format. Wrap your novel in { "novel": { ... } }';
      return;
    }

    buildSections();
    buildTOC();
    document.getElementById('r-book-title').textContent = novel.title || 'Novel';

    // Switch views
    document.getElementById('landing').classList.add('hidden');
    const reader = document.getElementById('reader');
    reader.classList.add('active');

    showSection(0, false);
  }

  /* ══════════════════════════════════════════
     BUILD SECTION LIST
  ══════════════════════════════════════════ */
  function buildSections() {
    sections = [];
    sections.push({ type: 'cover', label: 'Cover' });

    if (Array.isArray(novel.characters) && novel.characters.length) {
      sections.push({ type: 'characters', label: 'The Characters' });
    }

    (novel.chapters || []).forEach((ch, i) => {
      const num = ch.number || (i + 1);
      sections.push({
        type: 'chapter',
        index: i,
        label: toRoman(num) + '. ' + (ch.title || 'Chapter ' + num),
        sublabel: ch.point_of_view ? 'POV: ' + ch.point_of_view : ''
      });
    });

    if (Array.isArray(novel.notable_lines) && novel.notable_lines.length) {
      sections.push({ type: 'notable_lines', label: 'Notable Lines' });
    }

    if (novel.closing_note) {
      sections.push({ type: 'closing', label: novel.closing_note.title || 'Closing Note' });
    }
  }

  /* ══════════════════════════════════════════
     BUILD TOC
  ══════════════════════════════════════════ */
  function buildTOC() {
    const list = document.getElementById('toc-list');
    list.innerHTML = '';

    sections.forEach((sec, i) => {
      if (sec.type === 'chapter' && i > 0 && sections[i-1].type !== 'chapter') {
        const div = document.createElement('li');
        div.className = 'toc-divider';
        list.appendChild(div);
      }

      const li = document.createElement('li');
      li.className = 'toc-item';
      li.dataset.idx = i;

      let inner = esc(sec.label);
      if (sec.sublabel) inner += `<span class="toc-item-sub">${esc(sec.sublabel)}</span>`;
      li.innerHTML = inner;

      li.addEventListener('click', () => { showSection(i); closeTOC(); });
      list.appendChild(li);
    });
  }

  /* ══════════════════════════════════════════
     NAVIGATION
  ══════════════════════════════════════════ */
  function navigate(delta) {
    const next = currentIdx + delta;
    if (next < 0 || next >= sections.length) return;
    showSection(next);
  }

  function showSection(idx, animate = true) {
    idx = Math.max(0, Math.min(sections.length - 1, idx));
    currentIdx = idx;
    const sec = sections[idx];

    // Update TOC active
    document.querySelectorAll('.toc-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.idx) === idx);
    });

    // Scroll TOC item into view if needed
    const activeTOC = document.querySelector('.toc-item.active');
    if (activeTOC) activeTOC.scrollIntoView({ block: 'nearest' });

    // Update nav buttons
    document.getElementById('prev-btn').disabled = idx === 0;
    document.getElementById('next-btn').disabled = idx === sections.length - 1;

    // Update progress
    const pct = sections.length > 1 ? (idx / (sections.length - 1)) * 100 : 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('r-progress-text').textContent = (idx + 1) + ' / ' + sections.length;

    // Section name in footer
    document.getElementById('r-section-name').textContent = sec.label;

    // Render
    const page = document.getElementById('r-page');
    if (animate) {
      page.classList.add('fading');
      setTimeout(() => {
        page.innerHTML = renderSection(sec);
        page.classList.remove('fading');
        document.getElementById('r-content').scrollTop = 0;
      }, 200);
    } else {
      page.innerHTML = renderSection(sec);
      document.getElementById('r-content').scrollTop = 0;
    }
  }

  /* ══════════════════════════════════════════
     RENDER DISPATCHER
  ══════════════════════════════════════════ */
  function renderSection(sec) {
    switch (sec.type) {
      case 'cover':        return renderCover();
      case 'characters':   return renderCharacters();
      case 'chapter':      return renderChapter(sec.index);
      case 'notable_lines':return renderNotableLines();
      case 'closing':      return renderClosing();
      default:             return '<p>Unknown section.</p>';
    }
  }

  /* ══════════════════════════════════════════
     RENDER: COVER
  ══════════════════════════════════════════ */
  function renderCover() {
    const n = novel;
    const epi = n.epigraph || {};
    const meta = n.metadata || {};
    const genres = Array.isArray(n.genre) ? n.genre.join(' · ') : (n.genre || '');
    const themes = Array.isArray(n.themes) ? n.themes.join(', ') : (n.themes || '');

    let html = `<div class="section-cover">`;
    html += `<div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>`;
    if (genres) html += `<span class="cover-genre">${esc(genres)}</span>`;
    html += `<h1 class="cover-title">${esc(n.title || 'Untitled')}</h1>`;
    if (n.subtitle) html += `<p class="cover-subtitle">${esc(n.subtitle)}</p>`;
    html += divRule();
    if (n.author) html += `<p class="cover-author">by &nbsp;${esc(n.author)}</p>`;

    if (epi.text) {
      html += `<div class="cover-epigraph">
        <p class="epigraph-text">"${esc(epi.text)}"</p>
        ${epi.attribution ? `<p class="epigraph-attr">— ${esc(epi.attribution)}</p>` : ''}
      </div>`;
    }

    if (meta.setting || meta.tone || meta.style) {
      html += `<div class="cover-setting-box">`;
      if (meta.setting) html += `<p><em>Setting:</em> ${esc(meta.setting)}</p>`;
      if (meta.tone)    html += `<p><em>Tone:</em> ${esc(meta.tone)}</p>`;
      if (meta.style)   html += `<p><em>Style:</em> ${esc(meta.style)}</p>`;
      html += `</div>`;
    }

    if (themes) html += `<p class="cover-themes"><em>Themes:</em> ${esc(themes)}</p>`;
    html += `</div>`;
    return html;
  }

  /* ══════════════════════════════════════════
     RENDER: CHARACTERS
  ══════════════════════════════════════════ */
  function renderCharacters() {
    const chars = novel.characters || [];
    let html = `<div class="section-characters">`;
    html += `<div class="section-heading">
      <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
      <h2>The Characters</h2>
      ${divRule()}
    </div>`;

    chars.forEach(ch => {
      const traits = ch.personality || ch.traits || [];
      const desc   = ch.full_description || ch.description || '';
      const metaParts = [];
      if (ch.age) metaParts.push('Age ' + ch.age);
      if (ch.occupation) metaParts.push(ch.occupation);

      html += `<div class="char-card">`;
      html += `<div class="char-name">${esc(ch.name || '')}</div>`;
      if (ch.role) html += `<div class="char-role">${esc(ch.role)}</div>`;
      if (metaParts.length) html += `<div class="char-meta">${esc(metaParts.join(' · '))}</div>`;
      if (desc) html += `<div class="char-desc">${esc(desc)}</div>`;

      if (traits.length) {
        html += `<div class="char-traits">`;
        traits.forEach(t => { html += `<span class="trait-tag">${esc(t)}</span>`; });
        html += `</div>`;
      }

      if (ch.relationship_status) {
        html += `<div class="char-status">${esc(ch.relationship_status)}</div>`;
      }
      html += `</div>`;
    });

    html += `</div>`;
    return html;
  }

  /* ══════════════════════════════════════════
     RENDER: CHAPTER
  ══════════════════════════════════════════ */
  function renderChapter(idx) {
    const ch = novel.chapters[idx];
    const num = ch.number || (idx + 1);
    const content = ch.content || [];

    let html = `<div class="section-chapter">`;

    // Header
    html += `<div class="ch-header">
      <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
      <span class="ch-number">Chapter ${toRoman(num)}</span>
      <h2 class="ch-title">${esc(ch.title || '')}</h2>
      ${ch.point_of_view ? `<div class="ch-pov">Point of View: ${esc(ch.point_of_view)}</div>` : ''}
      ${divRule()}
    </div>`;

    // Epigraph
    if (ch.epigraph) {
      html += `<div class="ch-epigraph">${esc(ch.epigraph)}</div>`;
      html += divRule();
    }

    // Body
    html += `<div class="ch-body">`;
    content.forEach((para, i) => {
      html += classifyParagraph(para, i === 0);
    });
    html += `</div></div>`;

    return html;
  }

  function classifyParagraph(para, isFirst) {
    const len = para.trim().length;

    // Detect section break markers
    if (/^[·\.•\-\*]{3,}$/.test(para.trim())) {
      return `<div class="ch-break">${para}</div>`;
    }

    if (isFirst) {
      return `<p class="p-first">${esc(para)}</p>`;
    }

    // Very short (≤35 chars) — dramatic single fragments
    if (len <= 35) {
      return `<p class="p-fragment">${esc(para)}</p>`;
    }

    // Short but not tiny (36–90 chars) — short standalone lines
    if (len <= 90) {
      return `<p class="p-short">${esc(para)}</p>`;
    }

    // Detect dialogue-heavy paragraphs (starts with quote or name + colon or dash)
    if (/^['""‘’“”]/.test(para.trim()) ||
        /^[A-Z][a-z]+:/.test(para.trim())) {
      return `<p class="p-dialogue p-body">${esc(para)}</p>`;
    }

    return `<p class="p-body">${esc(para)}</p>`;
  }

  /* ══════════════════════════════════════════
     RENDER: NOTABLE LINES
  ══════════════════════════════════════════ */
  function renderNotableLines() {
    const lines = novel.notable_lines || [];
    let html = `<div class="section-notable">
      <div class="section-heading">
        <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
        <h2>Notable Lines</h2>
        ${divRule()}
      </div>
      <div class="notable-list">`;

    lines.forEach(item => {
      let source = '';
      if (item.chapter)      source = 'Chapter ' + toRoman(item.chapter);
      else if (item.closing_note) source = 'Closing Note';
      html += `<div class="notable-item">
        <div class="notable-line">${esc(item.line || '')}</div>
        ${source ? `<div class="notable-source">— ${source}</div>` : ''}
      </div>`;
    });

    html += `</div></div>`;
    return html;
  }

  /* ══════════════════════════════════════════
     RENDER: CLOSING NOTE
  ══════════════════════════════════════════ */
  function renderClosing() {
    const note = novel.closing_note || {};
    let html = `<div class="section-closing">
      <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
      <h2 class="closing-title">${esc(note.title || 'A Closing Note')}</h2>
      ${divRule()}
      <p class="closing-text">${esc(note.text || '')}</p>`;

    if (note.final_line) {
      html += `<div class="closing-final"><p>${esc(note.final_line)}</p></div>`;
    }

    html += `<div class="closing-fin">
      <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
      <span class="fin-word">Fin</span>
    </div></div>`;
    return html;
  }

  /* ══════════════════════════════════════════
     TOC OPEN / CLOSE
  ══════════════════════════════════════════ */
  function openTOC()  { document.getElementById('toc-overlay').classList.add('open'); }
  function closeTOC() { document.getElementById('toc-overlay').classList.remove('open'); }

  /* ══════════════════════════════════════════
     HELPERS
  ══════════════════════════════════════════ */
  function esc(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function divRule() {
    return `<div class="rule"><span class="rule-diamond">◆ ◆ ◆</span></div>`;
  }

  function toRoman(n) {
    if (!n || n < 1) return String(n || '');
    const vals = [10,9,5,4,1];
    const syms = ['X','IX','V','IV','I'];
    let r = '';
    vals.forEach((v, i) => { while (n >= v) { r += syms[i]; n -= v; } });
    return r;
  }

  /* ══════════════════════════════════════════
     KEYBOARD NAVIGATION
  ══════════════════════════════════════════ */
  document.addEventListener('keydown', e => {
    if (document.getElementById('toc-overlay').classList.contains('open')) {
      if (e.key === 'Escape') closeTOC();
      return;
    }
    if (document.getElementById('landing').style.display !== 'none' &&
        !document.getElementById('landing').classList.contains('hidden')) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); navigate(-1); }
    if (e.key === 'Escape')                               { closeTOC(); }
  });

  /* ══════════════════════════════════════════
     SWIPE (MOBILE)
  ══════════════════════════════════════════ */
  let touchStartX = 0;
  document.getElementById('r-content').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('r-content').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) navigate(dx < 0 ? 1 : -1);
  }, { passive: true });
</script>
</body>
</html>
